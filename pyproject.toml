[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sorrydave"
version = "0.10.7"
description = "DAVE (Discord Audio/Video End-to-End Encryption) protocol library — pure data and state layer on rfc9420"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [{ name = "mfdi" }]

keywords = [
  "dave",
  "e2ee",
  "mls",
  "webrtc",
  "voice",
  "discord",
  "rfc9420",
  "rfc9180"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]

dependencies = [
  "rfc9420>=1.3.0",
  "cryptography>=41",
  "pycryptodome>=3.19",
  "orjson",
]

[project.urls]
Repository = "https://github.com/MFDI-hub/sorrydave"
Documentation = "https://github.com/MFDI-hub/sorrydave#readme"

# Optional runtime extras
[project.optional-dependencies]
docs = [
  "mkdocs~=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "pymdown-extensions"
]

# -----------------------
# UV dependency groups
# -----------------------

[dependency-groups]

dev = [
  "python-dotenv>=1.0",
  "ruff>=0.6",
  "ty",
  "tomli>=2.0"
]

test = [
  "pytest>=8"
]

docs = [
  "mkdocs~=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "pymdown-extensions"
]

# -----------------------
# Packaging (setuptools)
# -----------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["sorrydave*"]

# -----------------------
# Your custom tool
# -----------------------

[tool.run_checks]
source_paths = ["sorrydave"]
test_paths = ["tests"]
python-versions = ["3.9", "3.10", "3.11", "3.12"]

# -----------------------
# Ruff configuration
# -----------------------

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["sorrydave"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "ARG",
  "S"
]

ignore = [
  "E501",
  "UP007"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]